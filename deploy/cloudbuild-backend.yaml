# Cloud Build config for the backend.
# Run from the repo root:
#   gcloud builds submit --config=deploy/cloudbuild-backend.yaml \
#     --substitutions=_REGION=us-central1,_REPO=reels-images
#
# The build context is the repo root because we need the `backend/`
# subdirectory, but the Dockerfile is INSIDE backend/. We point
# Docker at the right context with `dir:` in the build step.
#
# After this finishes, the image is at:
#   REGION-docker.pkg.dev/$PROJECT_ID/reels-images/backend:$SHORT_SHA

substitutions:
  _REGION: us-central1
  _REPO: reels-images
  _SERVICE: backend

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  # Build the image. We use the docker buildx-less `docker build` since
  # we don't need BuildKit cache mounts.
  - name: gcr.io/cloud-builders/docker
    id: build
    dir: backend
    args:
      - build
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - .

  # Push both tags
  - name: gcr.io/cloud-builders/docker
    id: push-sha
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
  - name: gcr.io/cloud-builders/docker
    id: push-latest
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest

timeout: 600s
